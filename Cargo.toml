[package]
name = "crystal-clear"
version = "0.1.0"
edition = "2021"
authors = ["Crystal Clear Contributors"]
description = "A safe cross-platform system cleaner TUI that moves files to Trash"
license = "MIT"
keywords = ["cleaner", "cache", "trash", "tui", "cross-platform"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.70"

[lib]
name = "crystal_clear_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "crystal"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# FFI Bindings
uniffi = { version = "0.28", features = ["cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# TUI Framework
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
color-eyre = "0.6"
strum = { version = "0.26", features = ["derive"] }

# Configuration
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

# Filesystem
walkdir = "2.4"
dirs = "5.0"
glob = "0.3"
trash = "5.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Audit
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
once_cell = "1.18"
bytesize = "1.3"
blake3 = "1.5"
regex = "1.10"
uuid = { version = "1.6", features = ["v4", "serde"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

# Platform-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
